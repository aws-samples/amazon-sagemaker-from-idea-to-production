<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="700" viewBox="0 0 1800 700" role="img" aria-labelledby="title desc">
<title id="title">Workshop flow</title>
<desc id="desc">Run 00-start-here first. The main path goes through steps 01 to 05. A fast track goes from 00 directly to step 03 and continues with steps 04 and 05. Optional notebooks in the additional-topics folder extend steps 03, 04, and 05. Always finish with 99-clean-up.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#687078"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E07B00"/></marker>
  <style>
    text { font-family: 'Amazon Ember', Arial, Helvetica, sans-serif; fill: #37475A; }
    .heading { font-size: 31px; font-weight: 700; fill: #232F3E; }
    .node { fill: #FFFFFF; stroke: #AAB7B8; stroke-width: 2; }
    .node-required { fill: #232F3E; stroke: #232F3E; stroke-width: 2; }
    .node-optional { fill: #F8F9F9; stroke: #AAB7B8; stroke-width: 2; stroke-dasharray: 8 6; }
    .number { font-size: 34px; font-weight: 700; fill: #E07B00; }
    .number-light { font-size: 34px; font-weight: 700; fill: #FF9900; }
    .node-label { font-size: 21px; font-weight: 700; fill: #232F3E; }
    .node-label-light { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .node-detail { font-size: 16px; fill: #687078; }
    .node-detail-light { font-size: 16px; fill: #D5DBDB; }
    .flow { stroke: #687078; stroke-width: 3; fill: none; }
    .fast { stroke: #E07B00; stroke-width: 3; fill: none; stroke-dasharray: 10 7; }
    .optional-flow { stroke: #AAB7B8; stroke-width: 2.5; fill: none; stroke-dasharray: 6 6; }
    .flow-label { font-size: 18px; font-weight: 600; fill: #E07B00; }
    .legend { font-size: 17px; fill: #37475A; }
  </style>
</defs>
<rect width="1800" height="700" fill="#FFFFFF"/>
<text x="40" y="58" class="heading">Workshop flow</text>

<!-- Legend -->
<rect x="1010" y="34" width="34" height="24" rx="5" class="node-required"/>
<text x="1054" y="53" class="legend">Required</text>
<rect x="1160" y="34" width="34" height="24" rx="5" class="node"/>
<text x="1204" y="53" class="legend">Workshop step</text>
<rect x="1360" y="34" width="34" height="24" rx="5" class="node-optional"/>
<text x="1404" y="53" class="legend">Optional notebook</text>
<line x1="1570" y1="46" x2="1620" y2="46" class="fast"/>
<text x="1630" y="53" class="legend">Fast track</text>

<!-- Main path: 7 nodes, width 210, gap 40, start x 40 -->
<g>
  <rect x="40" y="170" width="222" height="150" rx="12" class="node-required"/>
  <text x="62" y="214" class="number-light">00</text>
  <text x="62" y="250" class="node-label-light">Set up the</text>
  <text x="62" y="276" class="node-label-light">environment</text>
  <text x="62" y="303" class="node-detail-light">start-here</text>
</g>
<g>
  <rect x="290" y="170" width="222" height="150" rx="12" class="node"/>
  <text x="312" y="214" class="number">01</text>
  <text x="312" y="250" class="node-label">Experiment in</text>
  <text x="312" y="276" class="node-label">a notebook</text>
  <text x="312" y="303" class="node-detail">pandas, XGBoost, MLflow</text>
</g>
<g>
  <rect x="540" y="170" width="222" height="150" rx="12" class="node"/>
  <text x="562" y="214" class="number">02</text>
  <text x="562" y="250" class="node-label">Scale with</text>
  <text x="562" y="276" class="node-label">SageMaker AI jobs</text>
  <text x="562" y="303" class="node-detail">@remote, ModelTrainer</text>
</g>
<g>
  <rect x="790" y="170" width="222" height="150" rx="12" class="node"/>
  <text x="812" y="214" class="number">03</text>
  <text x="812" y="250" class="node-label">ML pipeline and</text>
  <text x="812" y="276" class="node-label">model registry</text>
  <text x="812" y="303" class="node-detail">@step, Pipelines</text>
</g>
<g>
  <rect x="1040" y="170" width="222" height="150" rx="12" class="node"/>
  <text x="1062" y="214" class="number">04</text>
  <text x="1062" y="250" class="node-label">Deploy and</text>
  <text x="1062" y="276" class="node-label">monitor</text>
  <text x="1062" y="303" class="node-detail">endpoint, Evidently</text>
</g>
<g>
  <rect x="1290" y="170" width="222" height="150" rx="12" class="node"/>
  <text x="1312" y="214" class="number">05</text>
  <text x="1312" y="250" class="node-label">Automate the</text>
  <text x="1312" y="276" class="node-label">deployment</text>
  <text x="1312" y="303" class="node-detail">SageMaker project</text>
</g>
<g>
  <rect x="1540" y="170" width="222" height="150" rx="12" class="node-required"/>
  <text x="1562" y="214" class="number-light">99</text>
  <text x="1562" y="250" class="node-label-light">Clean up</text>
  <text x="1562" y="276" class="node-label-light">resources</text>
  <text x="1562" y="303" class="node-detail-light">avoid costs</text>
</g>

<line x1="262" y1="245" x2="286" y2="245" class="flow" marker-end="url(#arrow)"/>
<line x1="512" y1="245" x2="536" y2="245" class="flow" marker-end="url(#arrow)"/>
<line x1="762" y1="245" x2="786" y2="245" class="flow" marker-end="url(#arrow)"/>
<line x1="1012" y1="245" x2="1036" y2="245" class="flow" marker-end="url(#arrow)"/>
<line x1="1262" y1="245" x2="1286" y2="245" class="flow" marker-end="url(#arrow)"/>
<line x1="1512" y1="245" x2="1536" y2="245" class="flow" marker-end="url(#arrow)"/>

<!-- Fast track 00 -> 03 above the main path -->
<path d="M 150 170 C 150 120, 900 120, 900 166" class="fast" marker-end="url(#arrow-orange)"/>
<text x="525" y="112" class="flow-label" text-anchor="middle">Fast track: pipelines only, 00 → 03 → 04 → 05</text>

<!-- Optional notebooks -->
<g>
  <rect x="700" y="470" width="360" height="120" rx="12" class="node-optional"/>
  <text x="722" y="508" class="node-label">Extend the pipeline</text>
  <text x="722" y="538" class="node-detail">03b: quality checks, batch transform</text>
  <text x="722" y="564" class="node-detail">03c: SageMaker Feature Store</text>
</g>
<g>
  <rect x="1090" y="470" width="300" height="120" rx="12" class="node-optional"/>
  <text x="1112" y="508" class="node-label">Native monitoring</text>
  <text x="1112" y="538" class="node-detail">04: SageMaker Model Monitor</text>
  <text x="1112" y="564" class="node-detail">A-B-testing: production variants</text>
</g>
<g>
  <rect x="1410" y="470" width="340" height="120" rx="12" class="node-optional"/>
  <text x="1432" y="508" class="node-label">Build and deploy CI/CD</text>
  <text x="1432" y="538" class="node-detail">05, 06: SageMaker project with</text>
  <text x="1432" y="564" class="node-detail">GitHub repositories</text>
</g>
<path d="M 900 320 L 880 466" class="optional-flow" marker-end="url(#arrow)"/>
<path d="M 1150 320 L 1220 466" class="optional-flow" marker-end="url(#arrow)"/>
<path d="M 1400 320 L 1560 466" class="optional-flow" marker-end="url(#arrow)"/>
<text x="700" y="640" class="node-detail">Optional notebooks are in the additional-topics folder.</text>
<text x="700" y="666" class="node-detail">Run them after the step they extend.</text>
</svg>
