<text x="44" y="126" class="group-label">Part 1: Deploy the approved model</text>

<rect x="44" y="150" width="250" height="230" rx="12" class="dark"/>
<text x="66" y="190" class="label-light">ML pipeline</text>
<text x="66" y="216" class="detail-light">from step 3</text>
<text x="66" y="262" class="detail-light">preprocess, train,</text>
<text x="66" y="286" class="detail-light">evaluate, register</text>

<rect x="360" y="150" width="320" height="100" rx="12" class="node"/>
<circle cx="382" cy="150" r="17" fill="#E07B00"/><text x="382" y="156" class="num" text-anchor="middle">1</text>
<text x="382" y="192" class="label">SageMaker Model Registry</text>
<text x="382" y="220" class="detail">approve the model package</text>

