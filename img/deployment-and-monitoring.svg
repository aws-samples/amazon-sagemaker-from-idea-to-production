<text x="66" y="812" class="detail">checks in the notebook</text>

<rect x="360" y="520" width="580" height="300" rx="12" class="node"/>
<circle cx="382" cy="520" r="17" fill="#E07B00"/><text x="382" y="526" class="num" text-anchor="middle">3</text>
<text x="382" y="562" class="label">Monitoring pipeline</text>
<text x="382" y="588" class="detail">SageMaker Pipelines, one ProcessingStep</text>
