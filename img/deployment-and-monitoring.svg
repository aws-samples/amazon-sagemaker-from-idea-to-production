<rect x="20" y="450" width="1760" height="430" rx="16" class="group"/>
<text x="44" y="486" class="group-label">Part 2: Monitor the model</text>

<rect x="44" y="520" width="250" height="130" rx="12" class="optional"/>
<text x="66" y="560" class="label">EventBridge</text>
<text x="66" y="586" class="label">Scheduler</text>
<text x="66" y="616" class="detail">daily, off by default</text>

<rect x="44" y="690" width="250" height="130" rx="12" class="node"/>
<text x="66" y="730" class="label">Notebook</text>
<text x="66" y="758" class="code">pipeline.start()</text>
