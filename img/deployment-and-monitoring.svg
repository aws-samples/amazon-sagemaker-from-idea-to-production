<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
<title id="title">Deployment and monitoring workflow of step 4</title>
<desc id="desc">The ML pipeline of step 3 registers the model package and writes the baseline to S3. The notebook approves the model package and deploys it to a real-time endpoint with data capture. The notebook sends test traffic with simulated drift and stores the ground truth labels in S3. A monitoring pipeline, started from the notebook or by an optional EventBridge Scheduler schedule, runs a processing job with Evidently on the baseline, the captured data, and the ground truth. It logs reports and metrics in the MLflow app, writes HTML reports to S3, and publishes an SNS email alert when a check fails.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#687078"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E07B00"/></marker>
  <style>
    text { font-family: 'Amazon Ember', Arial, Helvetica, sans-serif; fill: #37475A; }
    .heading { font-size: 31px; font-weight: 700; fill: #232F3E; }
    .group { fill: #F8F9F9; stroke: #AAB7B8; stroke-width: 2; }
    .group-label { font-size: 22px; font-weight: 700; fill: #232F3E; }
    .node { fill: #FFFFFF; stroke: #AAB7B8; stroke-width: 2; }
    .store { fill: #FFF3E0; stroke: #FF9900; stroke-width: 2; }
    .dark { fill: #232F3E; stroke: #232F3E; stroke-width: 2; }
    .optional { fill: #FFFFFF; stroke: #AAB7B8; stroke-width: 2; stroke-dasharray: 8 6; }
    .label { font-size: 20px; font-weight: 700; fill: #232F3E; }
    .label-light { font-size: 20px; font-weight: 700; fill: #FFFFFF; }
    .detail { font-size: 16px; fill: #687078; }
    .detail-light { font-size: 16px; fill: #D5DBDB; }
    .code { font-family: 'Courier New', monospace; font-size: 16px; font-weight: 700; fill: #232F3E; }
    .num { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
    .flow { stroke: #687078; stroke-width: 3; fill: none; }
    .data { stroke: #E07B00; stroke-width: 3; fill: none; }
    .dashed { stroke: #687078; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; }
    .flow-label { font-size: 16px; font-weight: 600; fill: #687078; }
    .legend { font-size: 17px; fill: #37475A; }
  </style>
</defs>
<rect width="1800" height="900" fill="#FFFFFF"/>
<text x="40" y="58" class="heading">Step 4: deploy and monitor</text>
<line x1="1150" y1="46" x2="1200" y2="46" class="flow"/><text x="1210" y="53" class="legend">Control</text>
<line x1="1310" y1="46" x2="1360" y2="46" class="data"/><text x="1370" y="53" class="legend">Data</text>
<rect x="1450" y="34" width="34" height="24" rx="5" class="store"/><text x="1494" y="53" class="legend">Data store</text>

