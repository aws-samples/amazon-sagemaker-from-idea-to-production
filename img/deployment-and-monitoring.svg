<rect x="1200" y="280" width="300" height="100" rx="12" class="store"/>
<text x="1222" y="320" class="label">Amazon S3</text>
<text x="1222" y="348" class="detail">ground truth labels</text>

<path d="M 294 200 L 356 200" class="flow" marker-end="url(#arrow)"/>
<path d="M 294 330 L 356 330" class="data" marker-end="url(#arrow-orange)"/>
<path d="M 680 200 L 766 200" class="flow" marker-end="url(#arrow)"/>
<text x="723" y="188" class="flow-label" text-anchor="middle">deploy</text>
<path d="M 940 280 L 940 254" class="data" marker-end="url(#arrow-orange)"/>
<text x="952" y="272" class="flow-label">invoke</text>
<path d="M 1110 200 L 1196 200" class="data" marker-end="url(#arrow-orange)"/>
<path d="M 1110 330 L 1196 330" class="data" marker-end="url(#arrow-orange)"/>

